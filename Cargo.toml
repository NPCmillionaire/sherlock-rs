[package]
name = "sherlock-rs"
version = "0.1.0"
edition = "2021"
description = "Hunt a username across social networks. A fast, concurrent Rust rewrite of sherlock-project/sherlock."
license = "MIT"
repository = "https://github.com/cloudsculptinglabs/sherlock-rs"
readme = "README.md"
keywords = ["osint", "username", "reconnaissance", "social", "security"]
categories = ["command-line-utilities"]

[[bin]]
name = "sherlock-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
opt-level = "z"
